[project]
name = "nt-classify"
version = "0.0.0"
description = "Region classifier for new-titles acquisitions: predicts one of 7 regions, supports online learning from human corrections."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=1.26",
  "joblib>=1.4",
  "openpyxl>=3.1",
]

[project.scripts]
nt-classify = "nt_classify.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nt_classify"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
